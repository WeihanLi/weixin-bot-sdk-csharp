name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    name: Restore Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ./weixin-bot-sdk-csharp.slnx

      - name: Build
        run: dotnet build ./weixin-bot-sdk-csharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ./Weixin.Bot.Sdk.Test/Weixin.Bot.Sdk.Test.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/TestResults --collect:"XPlat Code Coverage"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/TestResults